# bazaakhazaa.world: static site served from a git checkout
server {
    listen 80;
    listen [::]:80;
    server_name bazaakhazaa.world www.bazaakhazaa.world 45.76.199.91;

    root /var/www/bazaakhazaa;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # never serve git metadata, dotfiles or the deploy scripts
    # (ACME challenges under /.well-known stay reachable for certbot)
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ^~ /deploy/ {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # code changes with every push, so keep it short
    location ~* \.(?:js|css)$ {
        expires 1h;
    }

    location ^~ /assets/ {
        expires 30d;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml;
}
