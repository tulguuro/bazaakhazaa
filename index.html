<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Хувь тавилангийн матриц</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="matrix/site/site.css?v=86">
  <!-- The server lets browsers keep scripts for an hour. Raise every ?v= number
       on this page together when any script or the style sheet changes, so a
       visitor never runs a new file against an old one. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "./matrix/site/world.js": "./matrix/site/world.js?v=86",
        "./matrix/site/matrix3d.js": "./matrix/site/matrix3d.js?v=86",
        "./matrix/site/gfx.js": "./matrix/site/gfx.js?v=86",
        "./matrix/site/sound.js": "./matrix/site/sound.js?v=86",
        "./matrix/site/backdrop.js": "./matrix/site/backdrop.js?v=86",
        "./matrix/site/figures.js": "./matrix/site/figures.js?v=86",
        "./matrix/matrix.js": "./matrix/matrix.js?v=86",
        "./matrix/draw.js": "./matrix/draw.js?v=86",
        "./matrix/talents.js": "./matrix/talents.js?v=86",
        "./matrix/chapters.js": "./matrix/chapters.js?v=86",
        "./matrix/report.js": "./matrix/report.js?v=86",
        "./matrix/couple.js": "./matrix/couple.js?v=86"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="filmbox" class="filmbox" aria-hidden="true">
    <video id="film" muted playsinline preload="auto" disableremoteplayback></video>
  </div>
  <div id="veil" aria-hidden="true"></div>
  <!-- Sky and Earth pictures: Solar System Scope, https://www.solarsystemscope.com/textures/, CC BY 4.0.
       The owner asked for no credit line on the scene (2026-11-20). -->
  <div class="corner">
    <button id="skip" class="ghost" type="button">Алгасах</button>
    <button id="sound" class="sound" type="button" aria-pressed="false">
      <svg class="sound__icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path class="sound__body" d="M3.5 9.6h3.2l4.8-3.8v12.4l-4.8-3.8H3.5z"/>
        <path class="sound__wave sound__wave--1" d="M14.8 9.3a4 4 0 0 1 0 5.4"/>
        <path class="sound__wave sound__wave--2" d="M17.4 6.9a7.3 7.3 0 0 1 0 10.2"/>
        <path class="sound__mute" d="M15.4 9.6l4.8 4.8M20.2 9.6l-4.8 4.8"/>
      </svg>
      <span class="sound__label">Дуу нээх</span>
    </button>
  </div>
  <p id="caption" class="caption" aria-live="polite"></p>
  <p id="loader" class="loader">Одод цуглаж байна</p>
  <div id="opening" class="start" hidden>
    <button id="opening-go" class="start__go" type="button" disabled aria-label="Эхлэх">
      <span class="start__ring" aria-hidden="true"></span>
      <span class="start__word">Эхлэх</span>
    </button>
  </div>

  <form id="form" class="birth" hidden novalidate>
    <p class="birth__lead">Төрсөн өдрөө оруулна уу</p>
    <div class="birth__row">
      <label><span>Он</span><input id="year" inputmode="numeric" maxlength="4" autocomplete="off"></label>
      <label><span>Сар</span><input id="month" inputmode="numeric" maxlength="2" autocomplete="off"></label>
      <label><span>Өдөр</span><input id="day" inputmode="numeric" maxlength="2" autocomplete="off"></label>
      <label class="wide"><span>Овог</span><input id="clan" autocomplete="off"></label>
      <label class="wide"><span>Эцгийн нэр</span><input id="father" autocomplete="off"></label>
      <label class="wide"><span>Нэр</span><input id="name" autocomplete="off"></label>
      <div class="gender" role="radiogroup" aria-label="Хүйс">
        <button type="button" role="radio" aria-checked="false" data-g="male">Эрэгтэй</button>
        <button type="button" role="radio" aria-checked="false" data-g="female">Эмэгтэй</button>
      </div>
      <button type="submit" class="cta">Матрицаа нээх</button>
    </div>
    <p id="error" class="birth__error" role="alert"></p>
  </form>

  <form id="form2" class="birth" hidden novalidate>
    <p class="birth__lead">Хосынхоо төрсөн өдрийг оруулна уу</p>
    <div class="birth__row">
      <label><span>Он</span><input id="year2" inputmode="numeric" maxlength="4" autocomplete="off"></label>
      <label><span>Сар</span><input id="month2" inputmode="numeric" maxlength="2" autocomplete="off"></label>
      <label><span>Өдөр</span><input id="day2" inputmode="numeric" maxlength="2" autocomplete="off"></label>
      <label class="wide"><span>Нэр</span><input id="name2" autocomplete="off"></label>
      <button type="submit" class="cta">Тохирлыг нээх</button>
      <button id="back" class="ghost" type="button">Буцах</button>
    </div>
    <p id="error2" class="birth__error" role="alert"></p>
  </form>

  <section id="amin" class="amin" hidden>
    <p id="who" class="amin__who"></p>
    <p id="amin-kicker" class="kicker"></p>
    <h1 id="amin-title"></h1>
    <p id="amin-name" class="amin__name"></p>
    <p id="amin-keys" class="amin__keys"></p>
    <div class="amin__text">
      <p id="amin-text"></p>
      <div class="amin__figure">
        <p class="amin__figure-head">Таны дүр <span id="amin-figure"></span></p>
        <p id="amin-figure-story" class="amin__figure-story"></p>
        <button id="amin-figure-more" class="amin__figure-more" type="button" aria-expanded="false">Дэлгэрэнгүй</button>
      </div>
      <p id="amin-more"></p>
    </div>
    <div class="amin__actions">
      <button id="go" class="cta" type="button">Хөргөө унших</button>
      <button id="overview" class="ghost" type="button">Бүтэн матриц</button>
      <button id="pair0" class="ghost" type="button">Хосын тохирол</button>
      <button id="again" class="ghost" type="button">Өөр өдөр</button>
    </div>
  </section>

  <section id="journey" class="journey" hidden>
    <p id="hint" class="journey__hint"></p>
    <p class="journey__pay">
      <button id="start" class="cta cta--small" type="button">Аяллыг эхлүүлэх</button>
      <button id="contents2" class="ghost" type="button">Агуулга</button>
      <button id="pair" class="ghost" type="button">Хосын тохирол</button>
      <button id="own" class="ghost" type="button" hidden>Өөрийн матриц</button>
      <button id="again2" class="ghost" type="button">Өөр өдөр</button>
    </p>
  </section>

  <aside id="reading" class="reading" hidden>
    <div id="r-scroll" class="reading__scroll">
      <p id="r-kicker" class="kicker"></p>
      <h2 id="r-title"></h2>
      <div id="r-body"></div>
    </div>
    <nav class="reading__nav" aria-label="Аялал">
      <button id="prev" class="ghost" type="button">Өмнөх</button>
      <span id="r-count"></span>
      <button id="next" class="cta cta--small" type="button">Дараагийн цэг</button>
      <button id="contents" class="ghost" type="button">Агуулга</button>
      <button id="close" class="ghost" type="button">Матриц</button>
    </nav>
  </aside>

  <script type="module" src="matrix/site/main.js?v=86"></script>
</body>
</html>
