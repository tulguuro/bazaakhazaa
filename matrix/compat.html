<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Хоёр хүний тохирол</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="matrix.css">
</head>
<body>
  <main class="sheet">
    <header class="intro">
      <p class="kicker">Хувь тавилангийн матриц</p>
      <h1>Хоёр хүний тохирол</h1>
      <p class="lede">Хоёр хүний төрсөн огноог оруулахад амин тоо (матрицын төв) тус бүрийг бодож, хайр, гэр бүл, бизнес, нөхөрлөл, мөнгөний талаар хэр тохирохыг харуулна.</p>
      <form id="compat-form" class="date-form compat-form" novalidate>
        <fieldset>
          <legend>Нэгдүгээр хүн</legend>
          <div class="row">
            <label>Он <input id="y1" type="number" inputmode="numeric" min="1" max="9999" required></label>
            <label>Сар <input id="m1" type="number" inputmode="numeric" min="1" max="12" required></label>
            <label>Өдөр <input id="d1" type="number" inputmode="numeric" min="1" max="31" required></label>
            <label>Нэр <input id="n1" type="text" autocomplete="off"></label>
          </div>
        </fieldset>
        <fieldset>
          <legend>Хоёрдугаар хүн</legend>
          <div class="row">
            <label>Он <input id="y2" type="number" inputmode="numeric" min="1" max="9999" required></label>
            <label>Сар <input id="m2" type="number" inputmode="numeric" min="1" max="12" required></label>
            <label>Өдөр <input id="d2" type="number" inputmode="numeric" min="1" max="31" required></label>
            <label>Нэр <input id="n2" type="text" autocomplete="off"></label>
          </div>
        </fieldset>
        <div class="row"><button type="submit">Тохирлыг харах</button></div>
      </form>
      <p id="compat-error" class="error" role="alert" hidden></p>
      <nav class="jump" aria-label="Хуудсууд">
        <a href="./">Матриц тооцоолох</a>
        <a href="numbers.html">22 эрчим</a>
      </nav>
    </header>

    <article id="result" class="block profile" aria-live="polite"></article>
  </main>

  <script type="module" src="compat.js"></script>
</body>
</html>
